services:
  postgres:
    image: postgres:18
    container_name: improve-ash-postgres
    environment:
      POSTGRES_DB: improve_ash_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d improve_ash_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_v18:
