[tools]
erlang = "29.0.2"
elixir = "1.20.1-otp-29"
node = "26.3.1"
"npm:pnpm" = "11.8.0"
go = "1.26.4"
"go:github.com/tfkhdyt/geminicommit" = "latest"
"go:github.com/hmans/beans" = "0.4.2"
zellij = "0.44.3"
watchexec = "2.5.1"

[env]
DATABASE_URL = "postgres://postgres:postgres@localhost:5433/improve_ash_dev"
CLAUDE_CODE_OAUTH_TOKEN = "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"

[tasks."tools:bootstrap"]
description = "Install local Hex and Rebar for Elixir tooling"
run = "mix local.hex --force && mix local.rebar --force"

[tasks."db:up"]
description = "Start local Postgres"
run = "./scripts/db-up-postgres.sh"

[tasks.dev]
description = "Run dev services in a zellij session"
run = "./scripts/dev-zellij.sh"

[tasks."phx:server"]
description = "Run the Phoenix server"
run = "mix phx.server"

[tasks."deps:get"]
description = "Fetch Mix dependencies"
run = "mix deps.get"

[tasks.fmt]
description = "Run Elixir formatter"
run = "mix format"

[tasks.lint]
description = "Compile with warnings as errors"
run = "mix compile --warnings-as-errors"

[tasks.test]
description = "Run ExUnit tests"
run = "mise run db:up && mix test"

[tasks."stories:run"]
description = "Run executable backend product stories against the test database"
run = "mise run db:up && for story in priv/scripts/stories/*.exs; do MIX_ENV=test mix run \"$story\"; done"

[tasks."db:create"]
description = "Start Postgres and create the local database"
run = "mise run db:up && mix ecto.create"

[tasks."db:migrate"]
description = "Start Postgres and run database migrations"
run = "mise run db:up && mix ecto.migrate"

[tasks."db:reset"]
description = "Start Postgres and reset the local database"
run = "mise run db:up && mix ecto.reset"

[tasks."db:seed"]
description = "Seed demo data once seeds exist"
run = "mise run db:up && mix run priv/repo/seeds.exs"

[tasks."typescript:generate"]
description = "Regenerate AshTypescript contracts"
run = "mix ash_typescript.codegen"

[tasks."typescript:check"]
description = "Type-check generated TypeScript contract smoke imports"
run = "pnpm exec tsc --noEmit -p tsconfig.json"

[tasks."frontend:install"]
description = "Install frontend npm dependencies"
run = "npm --prefix frontend install"

[tasks."frontend:dev"]
description = "Run the Svelte/Vite frontend dev server"
run = "npm --prefix frontend run dev -- --host 127.0.0.1"

[tasks."frontend:build"]
description = "Build the Svelte/Vite frontend"
run = "npm --prefix frontend run build"

[tasks."frontend:check"]
description = "Type-check the Svelte/Vite frontend"
run = "npm --prefix frontend run check"

[tasks.verify]
description = "Run local verification"
run = "mise run fmt && mise run lint && mise run test && mix ash_typescript.codegen --check && mise run typescript:check && mise run stories:run && mise run frontend:check && mise run frontend:build"

[tasks."verify:backend"]
description = "Run backend-only story/model verification"
run = "mise run fmt && mise run lint && mise run test && mix ash_typescript.codegen --check && mise run typescript:check && mise run stories:run"
